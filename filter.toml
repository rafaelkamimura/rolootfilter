# RO LATAM loot filter — rules are evaluated top to bottom, first match wins (unless `continue = true`).
# Match keys : ids, resource, name_match, description, effect, min_id, max_id
# Actions    : size, glow ("auto" | "#rrggbb" | "none"), hide, effect_id, continue, unidentified, enabled

[settings]
client = 'C:\Gravity\Ragnarok'
glow_alpha = 200
glow_scale = 1.9
